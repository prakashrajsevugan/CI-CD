<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        name="viewport"

    >

    <title>Living Forest World</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js"
        }
    }
    </script>
</head>

<body>

<div id="scene"></div>

<div class="hud">

    <div class="title">
        <span>EXPLORE</span>
        <strong>THE WILD</strong>
    </div>

    <div class="time-box">
        <div id="timeIcon">☀</div>

        <div>
            <small id="period">DAY</small>
            <strong id="clock">08:00 AM</strong>
        </div>
    </div>

    <div class="controls">

    </div>

<div class="mobile-controls">

    <div

        id="joystick"
    >
        <div class="joystick-ring"></div>

        <div
            class="joystick-knob"
            id="joystickKnob"
        ></div>
    </div>

<script type="module">

import * as THREE from "three";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(
    0x9ac9a1,
    0.0022
);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    2500
);

camera.position.set(
    0,
    5,
    10
);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.1;

document
    .getElementById("scene")
    .appendChild(renderer.domElement);


/* =========================================================
   WORLD
========================================================= */

const WORLD_SIZE = 520;

const WORLD_HALF =
    WORLD_SIZE / 2;


/* =========================================================
   TERRAIN
========================================================= */

function terrainHeight(x, z) {

    const a =
        Math.sin(x * 0.018) * 2.5;

    const b =
        Math.cos(z * 0.021) * 2;

    const c =
        Math.sin((x + z) * 0.011) * 3;

    const d =
        Math.cos(
            Math.sqrt(
                x * x +
                z * z
            ) * 0.025
        ) * 1.5;

    return (
        a +
        b +
        c +
        d
    ) * 0.35;
}


const terrainGeometry =
    new THREE.PlaneGeometry(
        WORLD_SIZE,
        WORLD_SIZE,
        180,
        180
    );

terrainGeometry.rotateX(
    -Math.PI / 2
);


const terrainPositions =
    terrainGeometry.attributes.position;


for (
    let i = 0;
    i < terrainPositions.count;
    i++
) {

    const x =
        terrainPositions.getX(i);

    const z =
        terrainPositions.getZ(i);

    terrainPositions.setY(
        i,
        terrainHeight(x, z)
    );
}


terrainGeometry.computeVertexNormals();


const terrainMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4d803f,
        roughness: 1
    });


const terrain =
    new THREE.Mesh(
        terrainGeometry,
        terrainMaterial
    );

terrain.receiveShadow = true;

scene.add(terrain);


/* =========================================================
   SKY
========================================================= */

const skyMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x8bc8e8,
        side: THREE.BackSide
    });


const sky =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            1200,
            32,
            32
        ),
        skyMaterial
    );

scene.add(sky);


/* =========================================================
   SUN
========================================================= */

const sun =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            12,
            32,
            32
        ),
        new THREE.MeshBasicMaterial({
            color: 0xffdf65
        })
    );

scene.add(sun);


const sunLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.3
    );

sunLight.castShadow = true;

sunLight.shadow.mapSize.width =
    2048;

sunLight.shadow.mapSize.height =
    2048;

sunLight.shadow.camera.left =
    -150;

sunLight.shadow.camera.right =
    150;

sunLight.shadow.camera.top =
    150;

sunLight.shadow.camera.bottom =
    -150;

sunLight.shadow.camera.near =
    1;

sunLight.shadow.camera.far =
    600;

scene.add(sunLight);


/* =========================================================
   MOON
========================================================= */

const moon =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            9,
            32,
            32
        ),
        new THREE.MeshStandardMaterial({
            color: 0xdde5ff,
            emissive: 0x5e75aa,
            emissiveIntensity: 0.35
        })
    );

scene.add(moon);


const moonLight =
    new THREE.DirectionalLight(
        0x718bd8,
        0
    );

scene.add(moonLight);


const moonGlow =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            11,
            32,
            32
        ),
        new THREE.MeshBasicMaterial({
            color: 0x9cb7ff,
            transparent: true,
            opacity: 0.08
        })
    );

moon.add(moonGlow);


/* =========================================================
   STARS
========================================================= */

const starGeometry =
    new THREE.BufferGeometry();

const starPositions = [];

for (let i = 0; i < 1800; i++) {

    const radius = 950;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.random() *
        Math.PI * 0.75;

    const x =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        Math.abs(
            radius *
            Math.cos(phi)
        );

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    starPositions.push(
        x,
        y,
        z
    );
}


starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 2.2,
        sizeAttenuation: false,
        transparent: true,
        opacity: 0
    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* =========================================================
   LIGHTING
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(
        0xb9e5ff,
        0x36552c,
        1.2
    );

scene.add(hemisphere);


const ambient =
    new THREE.AmbientLight(
        0xffffff,
        0.25
    );

scene.add(ambient);


/* =========================================================
   RIVER
========================================================= */

const riverGeometry =
    new THREE.PlaneGeometry(
        100,
        500
    );

riverGeometry.rotateX(
    -Math.PI / 2
);


const river =
    new THREE.Mesh(
        riverGeometry,
        new THREE.MeshStandardMaterial({
            color: 0x399bb5,
            transparent: true,
            opacity: 0.75,
            roughness: 0.15
        })
    );

river.position.x = -75;

river.position.y = -0.35;

scene.add(river);


/* =========================================================
   DENSE GRASS
========================================================= */

const grassGroup =
    new THREE.Group();

scene.add(grassGroup);


/* ---------------------------------------------------------
   GRASS MATERIALS
--------------------------------------------------------- */

const grassMaterials = [

    new THREE.MeshStandardMaterial({
        color: 0x245b2c,
        roughness: 1
    }),

    new THREE.MeshStandardMaterial({
        color: 0x2f6b32,
        roughness: 1
    }),

    new THREE.MeshStandardMaterial({
        color: 0x3f8138,
        roughness: 1
    }),

    new THREE.MeshStandardMaterial({
        color: 0x579342,
        roughness: 1
    }),

    new THREE.MeshStandardMaterial({
        color: 0x6ba84a,
        roughness: 1
    })
];


/* ---------------------------------------------------------
   GRASS GEOMETRIES
--------------------------------------------------------- */

const grassGeometries = [

    new THREE.ConeGeometry(
        0.045,
        0.45,
        4
    ),

    new THREE.ConeGeometry(
        0.055,
        0.7,
        4
    ),

    new THREE.ConeGeometry(
        0.07,
        1.0,
        4
    ),

    new THREE.ConeGeometry(
        0.035,
        0.32,
        3
    )
];


function createGrass(
    x,
    z,
    scale,
    materialIndex,
    geometryIndex
) {

    const grass =
        new THREE.Mesh(
            grassGeometries[
                geometryIndex
            ],
            grassMaterials[
                materialIndex
            ]
        );

    grass.position.set(
        x,
        terrainHeight(x, z),
        z
    );

    grass.scale.setScalar(
        scale
    );

    grass.rotation.y =
        Math.random() *
        Math.PI;

    grass.rotation.z =
        THREE.MathUtils.randFloat(
            -0.15,
            0.15
        );

    grassGroup.add(grass);
}


/* =========================================================
   MAIN GRASS
========================================================= */

for (let i = 0; i < 7000; i++) {

    const x =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 8
        );

    const z =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 8
        );


    if (
        Math.abs(x + 75) < 10
    ) {
        continue;
    }


    if (
        Math.abs(x) < 5 &&
        Math.abs(z - 10) < 5
    ) {
        continue;
    }


    createGrass(
        x,
        z,
        THREE.MathUtils.randFloat(
            0.65,
            1.5
        ),
        Math.floor(
            Math.random() *
            grassMaterials.length
        ),
        Math.floor(
            Math.random() *
            3
        )
    );
}


/* =========================================================
   SHORT GRASS
========================================================= */

for (let i = 9000; i--;) {

    const x =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 5
        );

    const z =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 5
        );


    if (
        Math.abs(x + 75) < 9
    ) {
        continue;
    }


    createGrass(
        x,
        z,
        THREE.MathUtils.randFloat(
            0.35,
            0.75
        ),
        Math.floor(
            Math.random() *
            grassMaterials.length
        ),
        3
    );
}


/* =========================================================
   TALL GRASS
========================================================= */

for (let i = 1800; i--;) {

    const x =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 15
        );

    const z =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 15
        );


    if (
        Math.abs(x + 75) < 12
    ) {
        continue;
    }


    createGrass(
        x,
        z,
        THREE.MathUtils.randFloat(
            1.0,
            1.8
        ),
        Math.floor(
            Math.random() * 4
        ),
        Math.floor(
            Math.random() * 3
        )
    );
}


/* =========================================================
   TREES
========================================================= */

const trees =
    new THREE.Group();

scene.add(trees);


function createTree(
    x,
    z,
    scale
) {

    const tree =
        new THREE.Group();


    tree.position.set(
        x,
        terrainHeight(x, z),
        z
    );


    tree.scale.setScalar(
        scale
    );


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.35,
                0.55,
                4.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x60402c
            })
        );


    trunk.position.y =
        2.25;

    trunk.castShadow = true;

    tree.add(trunk);


    const leaves =
        new THREE.MeshStandardMaterial({
            color: 0x255e34,
            roughness: 1
        });


    const levels = [
        [5.2, 2.7],
        [7.0, 2.2],
        [8.5, 1.6]
    ];


    for (
        const level of levels
    ) {

        const foliage =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    level[1],
                    4,
                    9
                ),
                leaves
            );


        foliage.position.y =
            level[0];

        foliage.castShadow = true;

        tree.add(foliage);
    }


    trees.add(tree);
}


for (let i = 0; i < 430; i++) {

    const x =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 20
        );

    const z =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 20
        );


    if (
        Math.abs(x) < 14 ||
        Math.abs(x + 75) < 12
    ) {
        continue;
    }


    createTree(
        x,
        z,
        THREE.MathUtils.randFloat(
            0.65,
            1.5
        )
    );
}


/* =========================================================
   ROCKS
========================================================= */

const rocks =
    new THREE.Group();

scene.add(rocks);


const rockMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x666c68,
        roughness: 1
    });


for (let i = 0; i < 240; i++) {

    const x =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 15
        );

    const z =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 15
        );


    if (
        Math.abs(x) < 12
    ) {
        continue;
    }


    const radius =
        THREE.MathUtils.randFloat(
            0.3,
            1.5
        );


    const rock =
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                radius,
                0
            ),
            rockMaterial
        );


    rock.position.set(
        x,
        terrainHeight(x, z) +
        radius * 0.5,
        z
    );


    rock.scale.y =
        THREE.MathUtils.randFloat(
            0.5,
            1
        );


    rock.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );


    rock.castShadow = true;

    rocks.add(rock);
}


/* =========================================================
   FLOWERS
========================================================= */

const flowers =
    new THREE.Group();

scene.add(flowers);


const flowerColors = [
    0xff4d62,
    0xffd329,
    0xff8fd2,
    0xb982ff,
    0xffffff,
    0xff713b
];


function createFlower(
    x,
    z
) {

    const group =
        new THREE.Group();


    group.position.set(
        x,
        terrainHeight(x, z),
        z
    );


    const color =
        flowerColors[
            Math.floor(
                Math.random() *
                flowerColors.length
            )
        ];


    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.02,
                0.035,
                0.55,
                5
            ),
            new THREE.MeshStandardMaterial({
                color: 0x3c7936
            })
        );


    stem.position.y = 0.27;

    group.add(stem);


    for (let j = 0; j < 5; j++) {

        const angle =
            j / 5 *
            Math.PI * 2;


        const petal =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.1,
                    6,
                    5
                ),
                new THREE.MeshStandardMaterial({
                    color
                })
            );


        petal.position.set(
            Math.cos(angle) * 0.12,
            0.55,
            Math.sin(angle) * 0.12
        );


        petal.scale.y = 0.5;

        group.add(petal);
    }


    const center =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.07,
                6,
                6
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffdf48
            })
        );


    center.position.y = 0.55;

    group.add(center);

    flowers.add(group);
}


for (let i = 0; i < 850; i++) {

    const x =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 15
        );

    const z =
        THREE.MathUtils.randFloatSpread(
            WORLD_SIZE - 15
        );


    if (
        Math.abs(x) < 10 ||
        Math.abs(x + 75) < 10
    ) {
        continue;
    }


    createFlower(
        x,
        z
    );
}


/* =========================================================
   CHARACTER
========================================================= */

const character =
    new THREE.Group();

scene.add(character);


character.position.set(
    0,
    terrainHeight(0, 10),
    10
);


/* BODY */

const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.9,
            1.15,
            0.6
        ),
        new THREE.MeshStandardMaterial({
            color: 0xc82f35,
            roughness: 0.8
        })
    );


body.position.y = 1.15;

body.castShadow = true;

character.add(body);


/* HOODIE */

const hoodie =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.48,
            0.53,
            0.8,
            12
        ),
        new THREE.MeshStandardMaterial({
            color: 0xa91f28,
            roughness: 0.9
        })
    );


hoodie.position.y = 1.65;

hoodie.scale.z = 0.75;

character.add(hoodie);


/* HEAD */

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.48,
            24,
            18
        ),
        new THREE.MeshStandardMaterial({
            color: 0xffc59e,
            roughness: 0.85
        })
    );


head.position.y = 2.15;

head.castShadow = true;

character.add(head);


/* HAIR */

const hair =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.5,
            18,
            10,
            0,
            Math.PI * 2,
            0,
            Math.PI * 0.55
        ),
        new THREE.MeshStandardMaterial({
            color: 0x321d18
        })
    );


hair.position.y = 2.27;

character.add(hair);


/* EYES */

const eyeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x111111
    });


const leftEye =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.055,
            8,
            8
        ),
        eyeMaterial
    );


leftEye.position.set(
    -0.16,
    2.13,
    -0.44
);

character.add(leftEye);


const rightEye =
    leftEye.clone();

rightEye.position.x = 0.16;

character.add(rightEye);


/* LEGS */

const leftLeg =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            0.13,
            0.6,
            5,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0x26354c
        })
    );


leftLeg.position.set(
    -0.23,
    0.4,
    0
);

leftLeg.castShadow = true;

character.add(leftLeg);


const rightLeg =
    leftLeg.clone();

rightLeg.position.x = 0.23;

character.add(rightLeg);


/* SHOES */

const leftShoe =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.34,
            0.18,
            0.52
        ),
        new THREE.MeshStandardMaterial({
            color: 0x17191d
        })
    );


leftShoe.position.set(
    -0.23,
    0.04,
    -0.13
);

character.add(leftShoe);


const rightShoe =
    leftShoe.clone();

rightShoe.position.x = 0.23;

character.add(rightShoe);


/* ARMS */

const leftArm =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            0.12,
            0.65,
            5,
            8
        ),
        new THREE.MeshStandardMaterial({
            color: 0xc82f35
        })
    );


leftArm.position.set(
    -0.58,
    1.2,
    0
);

character.add(leftArm);


const rightArm =
    leftArm.clone();

rightArm.position.x = 0.58;

character.add(rightArm);


/* =========================================================
   BIRDS
========================================================= */

const birds = [];


function createBird() {

    const bird =
        new THREE.Group();


    const material =
        new THREE.MeshStandardMaterial({
            color: 0x202832,
            side: THREE.DoubleSide
        });


    const birdBody =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.18,
                8,
                6
            ),
            material
        );


    bird.add(birdBody);


    const leftWing =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                0.8,
                0.32
            ),
            material
        );


    leftWing.position.x = -0.4;

    bird.add(leftWing);


    const rightWing =
        leftWing.clone();

    rightWing.position.x = 0.4;

    bird.add(rightWing);


    bird.position.set(
        THREE.MathUtils.randFloatSpread(300),
        THREE.MathUtils.randFloat(25, 55),
        THREE.MathUtils.randFloatSpread(300)
    );


    scene.add(bird);


    birds.push({
        mesh: bird,

        speed:
            THREE.MathUtils.randFloat(
                5,
                10
            ),

        phase:
            Math.random() * 20
    });
}


for (let i = 0; i < 20; i++) {
    createBird();
}


/* =========================================================
   BUTTERFLIES
========================================================= */

const butterflies = [];


function createButterfly() {

    const butterfly =
        new THREE.Group();


    const material =
        new THREE.MeshBasicMaterial({
            color:
                flowerColors[
                    Math.floor(
                        Math.random() *
                        flowerColors.length
                    )
                ],
            side: THREE.DoubleSide
        });


    const left =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                0.35,
                0.3
            ),
            material
        );


    left.position.x = -0.18;

    butterfly.add(left);


    const right =
        left.clone();

    right.position.x = 0.18;

    butterfly.add(right);


    butterfly.position.set(
        THREE.MathUtils.randFloatSpread(220),
        THREE.MathUtils.randFloat(1, 4),
        THREE.MathUtils.randFloatSpread(220)
    );


    scene.add(butterfly);


    butterflies.push({
        mesh: butterfly,

        speed:
            THREE.MathUtils.randFloat(
                0.5,
                1.4
            ),

        phase:
            Math.random() * 20
    });
}


for (let i = 0; i < 50; i++) {
    createButterfly();
}


/* =========================================================
   FIREFLIES
========================================================= */

const fireflies = [];


const fireflyGeometry =
    new THREE.SphereGeometry(
        0.045,
        6,
        6
    );


for (let i = 0; i < 220; i++) {

    const firefly =
        new THREE.Mesh(
            fireflyGeometry,
            new THREE.MeshBasicMaterial({
                color: 0xfff59a,
                transparent: true
            })
        );


    firefly.position.set(
        THREE.MathUtils.randFloatSpread(280),
        THREE.MathUtils.randFloat(0.5, 5),
        THREE.MathUtils.randFloatSpread(280)
    );


    scene.add(firefly);


    fireflies.push({
        mesh: firefly,
        phase: Math.random() * 30
    });
}


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;
    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );


const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );


let joystickX = 0;

let joystickY = 0;

let joystickActive = false;


joystick.addEventListener(
    "pointerdown",
    event => {

        joystickActive = true;

        joystick.setPointerCapture(
            event.pointerId
        );

        updateJoystick(event);
    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if (!joystickActive)
            return;

        updateJoystick(event);
    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function updateJoystick(event) {

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        event.clientX -
        centerX;


    let dy =
        event.clientY -
        centerY;


    const radius =
        rect.width * 0.32;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance > radius) {

        dx =
            dx /
            distance *
            radius;

        dy =
            dy /
            distance *
            radius;
    }


    joystickX =
        dx / radius;


    joystickY =
        dy / radius;


    joystickKnob.style.transform =
        `translate(${dx}px, ${dy}px)`;
}


function resetJoystick() {

    joystickActive = false;

    joystickX = 0;

    joystickY = 0;

    joystickKnob.style.transform =
        "translate(0,0)";
}


/* =========================================================
   CHARACTER PHYSICS
========================================================= */

let velocity = 0;

let characterRotation = 0;

let walkTime = 0;


const MAX_SPEED = 7;

const MAX_REVERSE = 3;

const ACCELERATION = 9;

const BRAKING = 12;

const TURN_SPEED = 2.7;


/* =========================================================
   CHARACTER MOVEMENT
========================================================= */

function updateCharacter(delta) {

    let forwardInput = 0;

    let turnInput = 0;


    /* keyboard */

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        forwardInput += 1;
    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        forwardInput -= 1;
    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        turnInput += 1;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        turnInput -= 1;
    }


    /* joystick */

    if (
        Math.abs(joystickY) >
        0.08
    ) {

        forwardInput =
            -joystickY;
    }


    if (
        Math.abs(joystickX) >
        0.08
    ) {

        turnInput =
            joystickX;
    }


    /* =====================================================
       ACCELERATION
    ===================================================== */

    if (forwardInput > 0) {

        velocity +=
            ACCELERATION *
            forwardInput *
            delta;

    } else if (
        forwardInput < 0
    ) {

        velocity -=
            ACCELERATION *
            Math.abs(forwardInput) *
            delta;

    } else {

        if (velocity > 0) {

            velocity -=
                BRAKING *
                delta;

            if (velocity < 0)
                velocity = 0;

        } else if (velocity < 0) {

            velocity +=
                BRAKING *
                delta;

            if (velocity > 0)
                velocity = 0;
        }
    }


    velocity =
        THREE.MathUtils.clamp(
            velocity,
            -MAX_REVERSE,
            MAX_SPEED
        );


    /* =====================================================
       TURNING
    ===================================================== */

    const speedFactor =
        Math.min(
            Math.abs(velocity) /
            MAX_SPEED,
            1
        );


    if (
        Math.abs(velocity) >
        0.05
    ) {

        characterRotation +=
            turnInput *
            TURN_SPEED *
            speedFactor *
            delta *
            (
                velocity >= 0
                    ? 1
                    : -1
            );
    }


    character.rotation.y =
        characterRotation;


    /* =====================================================
       FORWARD DIRECTION
    ===================================================== */

    const forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    forward.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        characterRotation
    );


    /* =====================================================
       MOVE
    ===================================================== */

    character.position.x +=
        forward.x *
        velocity *
        delta;


    character.position.z +=
        forward.z *
        velocity *
        delta;


    /* boundaries */

    character.position.x =
        THREE.MathUtils.clamp(
            character.position.x,
            -WORLD_HALF + 8,
            WORLD_HALF - 8
        );


    character.position.z =
        THREE.MathUtils.clamp(
            character.position.z,
            -WORLD_HALF + 8,
            WORLD_HALF - 8
        );


    /* terrain */

    character.position.y =
        terrainHeight(
            character.position.x,
            character.position.z
        );


    /* =====================================================
       WALK ANIMATION
    ===================================================== */

    if (
        Math.abs(velocity) >
        0.1
    ) {

        walkTime +=
            delta *
            Math.abs(velocity) *
            2.5;


        const legSwing =
            Math.sin(
                walkTime
            ) *
            0.65 *
            speedFactor;


        const armSwing =
            Math.sin(
                walkTime
            ) *
            0.45 *
            speedFactor;


        leftLeg.rotation.x =
            legSwing;

        rightLeg.rotation.x =
            -legSwing;


        leftArm.rotation.x =
            -armSwing;

        rightArm.rotation.x =
            armSwing;


        body.position.y =
            1.15 +
            Math.abs(
                Math.sin(
                    walkTime * 2
                )
            ) *
            0.045;


        body.rotation.x =
            THREE.MathUtils.damp(
                body.rotation.x,
                -0.06 *
                speedFactor,
                8,
                delta
            );

    } else {

        leftLeg.rotation.x =
            THREE.MathUtils.damp(
                leftLeg.rotation.x,
                0,
                8,
                delta
            );

        rightLeg.rotation.x =
            THREE.MathUtils.damp(
                rightLeg.rotation.x,
                0,
                8,
                delta
            );

        leftArm.rotation.x =
            THREE.MathUtils.damp(
                leftArm.rotation.x,
                0,
                8,
                delta
            );

        rightArm.rotation.x =
            THREE.MathUtils.damp(
                rightArm.rotation.x,
                0,
                8,
                delta
            );

        body.rotation.x =
            THREE.MathUtils.damp(
                body.rotation.x,
                0,
                8,
                delta
            );

        body.position.y =
            THREE.MathUtils.damp(
                body.position.y,
                1.15,
                8,
                delta
            );
    }
}


/* =========================================================
   THIRD PERSON CAMERA
========================================================= */

const cameraPosition =
    new THREE.Vector3();


function updateCamera(delta) {

    const distance = 8.5;

    const height = 4.8;


    const backward =
        new THREE.Vector3(
            0,
            0,
            1
        );


    backward.applyAxisAngle(
        new THREE.Vector3(
            0,
            1,
            0
        ),
        characterRotation
    );


    cameraPosition.set(
        character.position.x +
        backward.x *
        distance,

        character.position.y +
        height,

        character.position.z +
        backward.z *
        distance
    );


    const smooth =
        1 -
        Math.pow(
            0.0001,
            delta
        );


    camera.position.lerp(
        cameraPosition,
        smooth
    );


    camera.lookAt(
        character.position.x,
        character.position.y + 1.4,
        character.position.z
    );
}


/* =========================================================
   DAY / NIGHT
========================================================= */

let worldTime = 8;

const DAY_LENGTH = 180;


function daylightAmount() {

    const angle =
        worldTime /
        24 *
        Math.PI * 2;


    const height =
        Math.sin(
            angle -
            Math.PI / 2
        );


    return THREE.MathUtils.clamp(
        height * 1.5 + 0.15,
        0,
        1
    );
}


function updateDayNight(delta) {

    worldTime +=
        delta *
        24 /
        DAY_LENGTH;


    if (worldTime >= 24)
        worldTime -= 24;


    const angle =
        worldTime /
        24 *
        Math.PI * 2;


    const sunRadius = 320;


    sun.position.set(
        Math.cos(angle) *
        sunRadius,

        Math.sin(angle) *
        sunRadius,

        -120
    );


    moon.position.set(
        -Math.cos(angle) *
        sunRadius,

        -Math.sin(angle) *
        sunRadius,

        80
    );


    sunLight.position.copy(
        sun.position
    );


    moonLight.position.copy(
        moon.position
    );


    const daylight =
        daylightAmount();


    const night =
        1 - daylight;


    /* LIGHT */

    sunLight.intensity =
        0.1 +
        daylight * 2.5;


    moonLight.intensity =
        night * 0.7;


    hemisphere.intensity =
        0.35 +
        daylight * 1.05;


    ambient.intensity =
        0.08 +
        daylight * 0.25;


    /* STARS */

    starMaterial.opacity =
        THREE.MathUtils.clamp(
            night * 1.2,
            0,
            1
        );


    /* MOON */

    moon.visible =
        night > 0.05;


    /* SUN */

    sun.visible =
        daylight > 0.02;


    /* SKY */

    const daySky =
        new THREE.Color(
            0x8bc8e8
        );


    const nightSky =
        new THREE.Color(
            0x06122e
        );


    skyMaterial.color.lerpColors(
        nightSky,
        daySky,
        daylight
    );


    /* SUNRISE */

    if (
        worldTime >= 5 &&
        worldTime < 8
    ) {

        skyMaterial.color.lerp(
            new THREE.Color(
                0xff8c68
            ),
            0.6
        );
    }


    /* SUNSET */

    if (
        worldTime >= 17 &&
        worldTime < 20
    ) {

        skyMaterial.color.lerp(
            new THREE.Color(
                0xf27b62
            ),
            0.65
        );
    }


    scene.fog.color.copy(
        skyMaterial.color
    );


    scene.fog.density =
        0.0022 +
        night * 0.001;


    /* CLOCK */

    const hours =
        Math.floor(worldTime);


    const minutes =
        Math.floor(
            (
                worldTime -
                hours
            ) * 60
        );


    const displayHour =
        hours % 12 || 12;


    const ampm =
        hours < 12
            ? "AM"
            : "PM";


    document.getElementById(
        "clock"
    ).textContent =
        `${String(displayHour).padStart(2, "0")}:${String(minutes).padStart(2, "0")} ${ampm}`;


    let period = "DAY";

    let icon = "☀";


    if (
        worldTime >= 5 &&
        worldTime < 8
    ) {

        period = "SUNRISE";
        icon = "🌅";

    } else if (
        worldTime >= 8 &&
        worldTime < 17
    ) {

        period = "DAY";
        icon = "☀";

    } else if (
        worldTime >= 17 &&
        worldTime < 20
    ) {

        period = "SUNSET";
        icon = "🌇";

    } else {

        period = "NIGHT";
        icon = "🌙";
    }


    document.getElementById(
        "period"
    ).textContent =
        period;


    document.getElementById(
        "timeIcon"
    ).textContent =
        icon;
}


/* =========================================================
   BIRDS
========================================================= */

function updateBirds(
    delta,
    elapsed
) {

    const active =
        daylightAmount() > 0.15;


    for (
        const bird of birds
    ) {

        bird.mesh.visible =
            active;


        bird.mesh.position.x +=
            bird.speed *
            delta;


        bird.mesh.position.z +=
            Math.sin(
                elapsed * 0.7 +
                bird.phase
            ) *
            delta *
            2;


        bird.mesh.position.y +=
            Math.sin(
                elapsed * 2 +
                bird.phase
            ) *
            delta;


        const flap =
            Math.sin(
                elapsed * 14 +
                bird.phase
            ) * 0.5;


        bird.mesh.children[1]
            .rotation.z = flap;


        bird.mesh.children[2]
            .rotation.z = -flap;


        if (
            bird.mesh.position.x >
            WORLD_HALF
        ) {

            bird.mesh.position.x =
                -WORLD_HALF;
        }
    }
}


/* =========================================================
   BUTTERFLIES
========================================================= */

function updateButterflies(
    delta,
    elapsed
) {

    const active =
        daylightAmount() > 0.3;


    for (
        const butterfly of butterflies
    ) {

        butterfly.mesh.visible =
            active;


        butterfly.mesh.position.x +=
            Math.sin(
                elapsed *
                butterfly.speed +
                butterfly.phase
            ) *
            delta *
            1.5;


        butterfly.mesh.position.z +=
            Math.cos(
                elapsed *
                butterfly.speed +
                butterfly.phase
            ) *
            delta *
            1.5;


        butterfly.mesh.position.y =
            2 +
            Math.sin(
                elapsed * 2 +
                butterfly.phase
            ) *
            0.7;


        const flap =
            Math.sin(
                elapsed * 14 +
                butterfly.phase
            );


        butterfly.mesh.children[0]
            .rotation.y =
            flap * 0.8;


        butterfly.mesh.children[1]
            .rotation.y =
            -flap * 0.8;
    }
}


/* =========================================================
   FIREFLIES
========================================================= */

function updateFireflies(
    elapsed
) {

    const night =
        1 -
        daylightAmount();


    for (
        const firefly of fireflies
    ) {

        firefly.mesh.visible =
            night > 0.25;


        firefly.mesh.position.y =
            2 +
            Math.sin(
                elapsed * 2 +
                firefly.phase
            ) * 1.5;


        const pulse =
            0.5 +
            0.5 *
            Math.sin(
                elapsed * 4 +
                firefly.phase
            );


        firefly.mesh.scale.setScalar(
            0.5 + pulse
        );


        firefly.mesh.material.opacity =
            pulse;
    }
}


/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    const elapsed =
        clock.elapsedTime;


    updateDayNight(
        delta
    );


    updateCharacter(
        delta
    );


    updateCamera(
        delta
    );


    updateBirds(
        delta,
        elapsed
    );


    updateButterflies(
        delta,
        elapsed
    );


    updateFireflies(
        elapsed
    );


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
