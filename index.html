<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shader Ocean</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div id="scene"></div>

  <div class="hud">
    <span>PROCEDURAL WORLD</span>
    <h1>OCEAN</h1>
    <div class="line"></div>
    <p>SHADER GENERATED SEA</p>
  </div>


  <script type="module">

    import * as THREE from "three";


    // =====================================================
    // SCENE
    // =====================================================

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0x020b12);

    scene.fog =
      new THREE.FogExp2(
        0x020b12,
        0.018
      );


    // =====================================================
    // CAMERA
    // =====================================================

    const camera =
      new THREE.PerspectiveCamera(
        55,
        innerWidth / innerHeight,
        0.1,
        1000
      );

    camera.position.set(
      0,
      3.5,
      9
    );


    // =====================================================
    // RENDERER
    // =====================================================

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    document
      .getElementById("scene")
      .appendChild(
        renderer.domElement
      );


    // =====================================================
    // OCEAN GEOMETRY
    // =====================================================

    const oceanGeometry =
      new THREE.PlaneGeometry(
        80,
        80,
        500,
        500
      );

    oceanGeometry.rotateX(
      -Math.PI / 2
    );


    // =====================================================
    // OCEAN VERTEX SHADER
    // =====================================================

    const vertexShader = `

      uniform float uTime;

      varying vec3 vWorldPosition;
      varying vec3 vNormal;


      float hash(vec2 p) {

        p =
          fract(
            p * vec2(
              123.34,
              456.21
            )
          );

        p +=
          dot(
            p,
            p + 45.32
          );

        return fract(
          p.x * p.y
        );
      }


      float noise(vec2 p) {

        vec2 i =
          floor(p);

        vec2 f =
          fract(p);

        f =
          f * f *
          (3.0 - 2.0 * f);

        float a =
          hash(i);

        float b =
          hash(
            i + vec2(1.0, 0.0)
          );

        float c =
          hash(
            i + vec2(0.0, 1.0)
          );

        float d =
          hash(
            i + vec2(1.0, 1.0)
          );

        return mix(
          mix(a, b, f.x),
          mix(c, d, f.x),
          f.y
        );
      }


      float fbm(vec2 p) {

        float value = 0.0;

        float amplitude = 0.5;

        for(int i = 0; i < 5; i++) {

          value +=
            noise(p) *
            amplitude;

          p *= 2.0;

          amplitude *= 0.5;
        }

        return value;
      }


      float wave(vec2 p) {

        float height = 0.0;


        height +=
          sin(
            p.x * 0.35 +
            uTime * 0.8
          ) * 0.35;


        height +=
          sin(
            p.y * 0.55 +
            uTime * 1.1
          ) * 0.22;


        height +=
          sin(
            (p.x + p.y) * 0.25 +
            uTime * 0.5
          ) * 0.3;


        height +=
          fbm(
            p * 0.08 +
            uTime * 0.025
          ) * 1.2;


        return height;
      }


      void main() {

        vec3 pos =
          position;


        float height =
          wave(pos.xz);


        pos.y =
          height;


        float eps =
          0.08;


        float heightX =
          wave(
            pos.xz +
            vec2(eps, 0.0)
          );


        float heightZ =
          wave(
            pos.xz +
            vec2(0.0, eps)
          );


        vec3 dx =
          vec3(
            eps,
            heightX - height,
            0.0
          );


        vec3 dz =
          vec3(
            0.0,
            heightZ - height,
            eps
          );


        vNormal =
          normalize(
            cross(dz, dx)
          );


        vec4 worldPosition =
          modelMatrix *
          vec4(
            pos,
            1.0
          );


        vWorldPosition =
          worldPosition.xyz;


        gl_Position =
          projectionMatrix *
          viewMatrix *
          worldPosition;

      }

    `;


    // =====================================================
    // OCEAN FRAGMENT SHADER
    // =====================================================

    const fragmentShader = `

      uniform float uTime;

      varying vec3 vWorldPosition;
      varying vec3 vNormal;


      void main() {

        vec3 viewDirection =
          normalize(
            cameraPosition -
            vWorldPosition
          );


        float fresnel =
          1.0 -
          max(
            dot(
              vNormal,
              viewDirection
            ),
            0.0
          );


        fresnel =
          pow(
            fresnel,
            3.0
          );


        vec3 deep =
          vec3(
            0.002,
            0.025,
            0.045
          );


        vec3 ocean =
          vec3(
            0.0,
            0.16,
            0.23
          );


        vec3 surface =
          vec3(
            0.0,
            0.5,
            0.62
          );


        vec3 color =
          mix(
            deep,
            ocean,
            fresnel
          );


        color =
          mix(
            color,
            surface,
            fresnel * 0.7
          );


        // Sun reflection

        vec3 sunDirection =
          normalize(
            vec3(
              -0.5,
              0.8,
              0.2
            )
          );


        float sun =
          max(
            dot(
              reflect(
                -sunDirection,
                vNormal
              ),
              viewDirection
            ),
            0.0
          );


        sun =
          pow(
            sun,
            100.0
          );


        color +=
          vec3(
            0.3,
            0.9,
            1.0
          ) *
          sun *
          2.0;


        // Surface highlights

        float highlight =
          pow(
            max(
              dot(
                vNormal,
                vec3(
                  0.0,
                  1.0,
                  0.0
                )
              ),
              0.0
            ),
            14.0
          );


        color +=
          vec3(
            0.0,
            0.3,
            0.4
          ) *
          highlight;


        // Fog

        float distanceFromCamera =
          distance(
            cameraPosition,
            vWorldPosition
          );


        float fog =
          smoothstep(
            15.0,
            55.0,
            distanceFromCamera
          );


        color =
          mix(
            color,
            vec3(
              0.005,
              0.025,
              0.035
            ),
            fog
          );


        gl_FragColor =
          vec4(
            color,
            1.0
          );

      }

    `;


    // =====================================================
    // OCEAN MATERIAL
    // =====================================================

    const oceanMaterial =
      new THREE.ShaderMaterial({

        vertexShader,

        fragmentShader,

        uniforms: {

          uTime: {
            value: 0
          }

        },

        side:
          THREE.DoubleSide

      });


    const ocean =
      new THREE.Mesh(
        oceanGeometry,
        oceanMaterial
      );

    scene.add(ocean);


    // =====================================================
    // BOAT
    // =====================================================

    const boat =
      new THREE.Group();

    scene.add(boat);


    // =====================================================
    // HULL
    // =====================================================

    const hullGeometry =
      new THREE.BoxGeometry(
        2.5,
        0.45,
        1.05
      );


    const hullMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x3b2012,
        roughness: 0.65,
        metalness: 0.05
      });


    const hull =
      new THREE.Mesh(
        hullGeometry,
        hullMaterial
      );

    boat.add(hull);


    // =====================================================
    // LOWER HULL
    // =====================================================

    const lowerHullGeometry =
      new THREE.CylinderGeometry(
        0.55,
        1.0,
        2.4,
        4
      );


    const lowerHull =
      new THREE.Mesh(
        lowerHullGeometry,
        hullMaterial
      );

    lowerHull.rotation.z =
      Math.PI / 2;

    lowerHull.scale.y =
      0.65;

    lowerHull.position.y =
      -0.22;

    boat.add(lowerHull);


    // =====================================================
    // DECK
    // =====================================================

    const deckGeometry =
      new THREE.BoxGeometry(
        2.2,
        0.12,
        0.9
      );


    const deckMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x9a6138,
        roughness: 0.8
      });


    const deck =
      new THREE.Mesh(
        deckGeometry,
        deckMaterial
      );

    deck.position.y =
      0.3;

    boat.add(deck);


    // =====================================================
    // CABIN
    // =====================================================

    const cabinGeometry =
      new THREE.BoxGeometry(
        0.9,
        0.55,
        0.7
      );


    const cabinMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xe5ddc8,
        roughness: 0.7
      });


    const cabin =
      new THREE.Mesh(
        cabinGeometry,
        cabinMaterial
      );

    cabin.position.set(
      -0.25,
      0.62,
      0
    );

    boat.add(cabin);


    // =====================================================
    // WINDOWS
    // =====================================================

    const windowMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x061b28,
        metalness: 0.5,
        roughness: 0.1
      });


    function createWindow(z) {

      const geometry =
        new THREE.BoxGeometry(
          0.28,
          0.22,
          0.025
        );


      const windowMesh =
        new THREE.Mesh(
          geometry,
          windowMaterial
        );


      windowMesh.position.set(
        -0.25,
        0.68,
        z
      );


      boat.add(
        windowMesh
      );
    }


    createWindow(0.36);

    createWindow(-0.36);


    // =====================================================
    // MAST
    // =====================================================

    const mastGeometry =
      new THREE.CylinderGeometry(
        0.045,
        0.055,
        2.6,
        12
      );


    const mastMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x5b3822
      });


    const mast =
      new THREE.Mesh(
        mastGeometry,
        mastMaterial
      );


    mast.position.set(
      0.75,
      1.45,
      0
    );


    boat.add(mast);


    // =====================================================
    // SAIL
    // =====================================================

    const sailShape =
      new THREE.Shape();


    sailShape.moveTo(0, 0);

    sailShape.lineTo(
      0,
      1.9
    );

    sailShape.lineTo(
      -1.0,
      0.15
    );

    sailShape.lineTo(
      0,
      0
    );


    const sailGeometry =
      new THREE.ShapeGeometry(
        sailShape
      );


    const sailMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xf0ead8,
        roughness: 0.9,
        side: THREE.DoubleSide
      });


    const sail =
      new THREE.Mesh(
        sailGeometry,
        sailMaterial
      );


    sail.position.set(
      0.72,
      1.15,
      0
    );


    boat.add(sail);


    // =====================================================
    // BOAT POSITION
    // =====================================================

    boat.position.set(
      0,
      0,
      -3
    );


    boat.scale.setScalar(
      0.9
    );


    // =====================================================
    // BOAT WAVE FUNCTION
    // Same basic waves as shader
    // =====================================================

    function boatWave(
      x,
      z,
      time
    ) {

      let height = 0;


      height +=
        Math.sin(
          x * 0.35 +
          time * 0.8
        ) * 0.35;


      height +=
        Math.sin(
          z * 0.55 +
          time * 1.1
        ) * 0.22;


      height +=
        Math.sin(
          (x + z) * 0.25 +
          time * 0.5
        ) * 0.3;


      height +=
        Math.sin(
          x * 0.55 +
          z * 0.31 +
          time * 0.3
        ) * 0.15;


      height +=
        Math.sin(
          x * 1.2 -
          z * 0.7 +
          time * 0.5
        ) * 0.08;


      return height;
    }


    // =====================================================
    // LIGHTING
    // =====================================================

    const ambientLight =
      new THREE.AmbientLight(
        0x88bbcc,
        1.3
      );

    scene.add(
      ambientLight
    );


    const sunLight =
      new THREE.DirectionalLight(
        0x99eeff,
        4
      );

    sunLight.position.set(
      -5,
      10,
      5
    );

    scene.add(
      sunLight
    );


    // =====================================================
    // SUN
    // =====================================================

    const sun =
      new THREE.Mesh(

        new THREE.SphereGeometry(
          1.5,
          32,
          32
        ),

        new THREE.MeshBasicMaterial({
          color: 0x66ffff
        })

      );


    sun.position.set(
      -12,
      8,
      -25
    );


    scene.add(
      sun
    );


    // =====================================================
    // STARS
    // =====================================================

    const starCount =
      1800;


    const starPositions =
      new Float32Array(
        starCount * 3
      );


    for (
      let i = 0;
      i < starCount;
      i++
    ) {

      const radius =
        8 +
        Math.random() * 18;


      const theta =
        Math.random() *
        Math.PI * 2;


      const phi =
        Math.acos(
          2 *
          Math.random() -
          1
        );


      starPositions[
        i * 3
      ] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);


      starPositions[
        i * 3 + 1
      ] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);


      starPositions[
        i * 3 + 2
      ] =
        radius *
        Math.cos(phi);

    }


    const starsGeometry =
      new THREE.BufferGeometry();


    starsGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );


    const stars =
      new THREE.Points(

        starsGeometry,

        new THREE.PointsMaterial({
          color: 0x66ffff,
          size: 0.025,
          transparent: true,
          opacity: 0.8
        })

      );


    scene.add(
      stars
    );


    // =====================================================
    // MOUSE
    // =====================================================

    const mouse = {
      x: 0,
      y: 0
    };


    window.addEventListener(
      "mousemove",
      (event) => {

        mouse.x =
          event.clientX /
          innerWidth *
          2 -
          1;


        mouse.y =
          event.clientY /
          innerHeight *
          2 -
          1;

      }
    );


    // =====================================================
    // ANIMATION
    // =====================================================

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      const time =
        clock.getElapsedTime();


      // Update shader

      oceanMaterial
        .uniforms
        .uTime
        .value =
        time;


      // -----------------------------------------------
      // BOAT FLOATING
      // -----------------------------------------------

      const boatX =
        boat.position.x;

      const boatZ =
        boat.position.z;


      const centerHeight =
        boatWave(
          boatX,
          boatZ,
          time
        );


      boat.position.y =
        centerHeight +
        0.42;


      // -----------------------------------------------
      // SAMPLE WAVES
      // -----------------------------------------------

      const sample =
        0.18;


      const left =
        boatWave(
          boatX - sample,
          boatZ,
          time
        );


      const right =
        boatWave(
          boatX + sample,
          boatZ,
          time
        );


      const front =
        boatWave(
          boatX,
          boatZ - sample,
          time
        );


      const back =
        boatWave(
          boatX,
          boatZ + sample,
          time
        );


      const slopeX =
        (right - left) /
        (sample * 2);


      const slopeZ =
        (back - front) /
        (sample * 2);


      // -----------------------------------------------
      // BOAT TILT
      // -----------------------------------------------

      boat.rotation.z +=
        (
          -slopeX * 0.55 -
          boat.rotation.z
        ) * 0.06;


      boat.rotation.x +=
        (
          slopeZ * 0.55 -
          boat.rotation.x
        ) * 0.06;


      boat.rotation.y =
        Math.sin(
          time * 0.35
        ) * 0.035;


      // -----------------------------------------------
      // STARS
      // -----------------------------------------------

      stars.rotation.y =
        time * 0.01;


      // -----------------------------------------------
      // CAMERA
      // -----------------------------------------------

      camera.position.x +=
        (
          mouse.x * 1.5 -
          camera.position.x
        ) * 0.02;


      camera.position.y +=
        (
          3.5 -
          mouse.y -
          camera.position.y
        ) * 0.02;


      camera.lookAt(
        0,
        0,
        -3
      );


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          innerWidth /
          innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          innerWidth,
          innerHeight
        );

      }
    );

  </script>

</body>
</html>
