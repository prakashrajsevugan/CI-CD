<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question 💖</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="hearts">
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
  </div>

  <main class="card">

    <div class="heart">💗</div>

    <p class="small-text">A little question...</p>

    <h1>
      Will you be<br>
      <span>my special one?</span>
    </h1>

    <p class="message">
      Life feels a little brighter, happier, and more beautiful
      with someone special by your side.
    </p>

    <div class="buttons">
      <button class="yes-btn">Yes 💖</button>
      <button class="maybe-btn">Maybe 🌸</button>
    </div>

    <p class="footer">Made with ♡</p>

  </main>

</body>
</html>
